name: IMPACT7 CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9'

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint & Type Check
  # ─────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check (must be 0 errors)
        run: |
          ERROR_COUNT=$(npx tsc --noEmit 2>&1 | grep "error TS" | wc -l)
          echo "TypeScript errors: $ERROR_COUNT"
          if [ "$ERROR_COUNT" -gt "0" ]; then
            echo "❌ TypeScript check FAILED: $ERROR_COUNT errors found"
            npx tsc --noEmit 2>&1 | grep "error TS"
            exit 1
          fi
          echo "✅ TypeScript check PASSED: 0 errors"

      - name: ESLint check
        run: |
          if [ -f ".eslintrc*" ] || [ -f "eslint.config*" ]; then
            npx eslint . --ext .ts,.tsx --max-warnings 0
          else
            echo "⚠️  No ESLint config found, skipping lint"
          fi

  # ─────────────────────────────────────────────
  # JOB 2: Unit & Integration Tests
  # ─────────────────────────────────────────────
  test:
    name: Tests (376/376)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'mysql://test:test@localhost:3306/test' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-jwt-secret-for-ci-only' }}
      VITE_APP_ID: ${{ secrets.VITE_APP_ID || 'test-app-id' }}
      OAUTH_SERVER_URL: ${{ secrets.OAUTH_SERVER_URL || 'https://api.manus.im' }}
      VITE_OAUTH_PORTAL_URL: ${{ secrets.VITE_OAUTH_PORTAL_URL || 'https://manus.im' }}
      BUILT_IN_FORGE_API_URL: ${{ secrets.BUILT_IN_FORGE_API_URL || 'https://api.manus.im' }}
      BUILT_IN_FORGE_API_KEY: ${{ secrets.BUILT_IN_FORGE_API_KEY || 'test-key' }}
      VITE_FRONTEND_FORGE_API_KEY: ${{ secrets.VITE_FRONTEND_FORGE_API_KEY || 'test-key' }}
      VITE_FRONTEND_FORGE_API_URL: ${{ secrets.VITE_FRONTEND_FORGE_API_URL || 'https://api.manus.im' }}
      OWNER_OPEN_ID: ${{ secrets.OWNER_OPEN_ID || 'test-owner' }}
      OWNER_NAME: ${{ secrets.OWNER_NAME || 'Test Owner' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test suite
        run: |
          pnpm test --run --reporter=verbose 2>&1 | tee test-results.txt
          PASS=$(grep -E "Tests.*passed" test-results.txt | tail -1)
          FAIL=$(grep -E "Tests.*failed" test-results.txt | tail -1)
          echo "Test results: $PASS $FAIL"
          if echo "$FAIL" | grep -q "failed"; then
            echo "❌ Tests FAILED"
            exit 1
          fi
          echo "✅ All tests PASSED"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.txt
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 3: Build Verification
  # ─────────────────────────────────────────────
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      DATABASE_URL: 'mysql://test:test@localhost:3306/test'
      JWT_SECRET: 'test-jwt-secret-for-ci-only'
      VITE_APP_ID: 'test-app-id'
      OAUTH_SERVER_URL: 'https://api.manus.im'
      VITE_OAUTH_PORTAL_URL: 'https://manus.im'
      BUILT_IN_FORGE_API_URL: 'https://api.manus.im'
      BUILT_IN_FORGE_API_KEY: 'test-key'
      VITE_FRONTEND_FORGE_API_KEY: 'test-key'
      VITE_FRONTEND_FORGE_API_URL: 'https://api.manus.im'
      OWNER_OPEN_ID: 'test-owner'
      OWNER_NAME: 'Test Owner'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: |
          pnpm build 2>&1 | tee build-output.txt
          if grep -qi "error\|failed" build-output.txt; then
            echo "❌ Build FAILED"
            cat build-output.txt
            exit 1
          fi
          echo "✅ Build PASSED"

      - name: Check bundle size
        run: |
          if [ -d "dist" ]; then
            BUNDLE_SIZE=$(du -sh dist/ | cut -f1)
            echo "📦 Bundle size: $BUNDLE_SIZE"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-dist
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 4: Security Audit
  # ─────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: |
          pnpm audit --audit-level=high 2>&1 | tee audit-results.txt || true
          if grep -qi "critical\|high" audit-results.txt; then
            echo "⚠️  Security vulnerabilities found (high/critical)"
            cat audit-results.txt
            # Don't fail CI for now, just warn
          else
            echo "✅ No high/critical vulnerabilities found"
          fi

  # ─────────────────────────────────────────────
  # JOB 5: SET7 Compliance Check
  # ─────────────────────────────────────────────
  set7-compliance:
    name: SET7 Compliance Gate
    runs-on: ubuntu-latest
    needs: [test, build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify SET7 Bunker documents exist
        run: |
          echo "🔍 Checking SET7 Bunker documents..."
          MISSING=0

          check_file() {
            if [ -f "$1" ]; then
              echo "  ✅ $1"
            else
              echo "  ❌ MISSING: $1"
              MISSING=$((MISSING + 1))
            fi
          }

          check_file "S7_BUNKER/02_INT/\$INT.md"
          check_file "S7_BUNKER/02_INT/TASKLOG.jsonl"
          check_file "S7_BUNKER/03_ARCH/ARCH_MANIFEST.md"
          check_file "S7_BUNKER/04_COLISAO/PROCESSO_COLISAO.md"
          check_file "S7_BUNKER/05_DNA/POS/\$DNA_POS.md"
          check_file "S7_BUNKER/06_OPS/RUNBOOK.md"
          check_file "S7_BUNKER/07_GLOSSARIO/\$GLOSSARY.md"

          if [ "$MISSING" -gt "0" ]; then
            echo "❌ SET7 Compliance FAILED: $MISSING documents missing"
            exit 1
          fi
          echo "✅ SET7 Compliance PASSED: All governance documents present"

      - name: Verify TASKLOG has entries
        run: |
          ENTRIES=$(wc -l < S7_BUNKER/02_INT/TASKLOG.jsonl)
          echo "📋 TASKLOG entries: $ENTRIES"
          if [ "$ENTRIES" -lt "1" ]; then
            echo "❌ TASKLOG is empty"
            exit 1
          fi
          echo "✅ TASKLOG has $ENTRIES entries"

  # ─────────────────────────────────────────────
  # JOB 6: All Gates Passed
  # ─────────────────────────────────────────────
  all-gates-passed:
    name: ✅ All Quality Gates Passed
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, build, security, set7-compliance]
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          echo "Pipeline Summary:"
          echo "  Lint & TypeScript: ${{ needs.lint-and-typecheck.result }}"
          echo "  Tests:             ${{ needs.test.result }}"
          echo "  Build:             ${{ needs.build.result }}"
          echo "  Security:          ${{ needs.security.result }}"
          echo "  SET7 Compliance:   ${{ needs.set7-compliance.result }}"

          if [[ "${{ needs.lint-and-typecheck.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.set7-compliance.result }}" != "success" ]]; then
            echo "❌ One or more quality gates FAILED"
            exit 1
          fi
          echo "✅ All quality gates PASSED — Ready for deployment"
